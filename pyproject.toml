[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mti-sites-sethstenzel.me"
version = "0.1.0"
description = "MTI NiceGUI / web sites for sethstenzel.me"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Seth Stenzel", email = "you@example.com" }
]
dependencies = [
    "nicegui>=3.4.1,<3.5", # Pinned: uv.lock is gitignored, so an open range let prod drift ahead of dev
    "fastapi>=0.121.2", # For webhook listener auto-deployment
    "uvicorn[standard]>=0.32.0", # ASGI server for FastAPI
    "google-auth>=2.35.0", # For Gmail API authentication
    "google-auth-oauthlib>=1.2.3", # OAuth for Gmail API
    "google-api-python-client>=2.149.0", # Gmail API client
    "loguru>=0.7.0", # Better logging
    "pyyaml>=6.0",  # Blog post frontmatter parsing
]

[project.urls]
Homepage = "https://sethstenzel.me"

[project.scripts]
blog-editor = "mti_sites_sethstenzel_me.blog_editor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
